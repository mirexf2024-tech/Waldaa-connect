function translateDOM(scope=document){const lang=state.preferences.language||'om';if(lang==='om')return;const idx=lang==='am'?1:0;const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){const original=node.nodeValue;const key=original.trim();if(uiWords[key]){const lead=original.match(/^\s*/)?.[0]||'',trail=original.match(/\s*$/)?.[0]||'';node.nodeValue=lead+uiWords[key][idx]+trail;}}const attrMap={'Afaan filadhu':['Choose language','ቋንቋ ይምረጡ'],'Waldaa filadhu':['Choose church','ቤተ ክርስቲያን ይምረጡ'],'Maqaa barbaadi...':['Search by name...','በስም ፈልግ...'],'Fakkeenya: Adama':['Example: Adama','ምሳሌ፦ አዳማ'],'Fakkeenya: Mihratuun':['Example: Your name','ምሳሌ፦ ስምዎ']};scope.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a);if(v&&attrMap[v])el.setAttribute(a,attrMap[v][idx])}));}

function activeChurch(){if(session?.mode==='firebase'&&firebaseChurch&&(!activeChurchId||firebaseChurch.id===activeChurchId))return firebaseChurch;return state.churches.find(c=>c.id===activeChurchId)||{id:'',churchId:'',name:'Waldaa hin filatamne',country:'',city:'',members:0,status:'unavailable'}}
function roleName(role){return (roleLabels[state.preferences.language]||roleLabels.om)[role]||role}
function notify(message){const el=document.getElementById('toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
function iconFor(view){const found=navGroups.flatMap(g=>g.items).find(i=>i[0]===view);return found?found[1]:'✦'}
function canSee(view){if(!session)return false;const map={developer:['developer','home','bible','growth','prayer','choir','community','churches','management','finance','ai','notifications','profile','settings'],pastor:['home','bible','growth','prayer','choir','community','churches','management','finance','ai','notifications','profile','settings'],member:['home','bible','growth','prayer','choir','community','churches','ai','notifications','profile','settings'],finance:['home','bible','growth','prayer','choir','community','churches','finance','ai','notifications','profile','settings'],choir:['home','bible','growth','prayer','choir','community','churches','ai','notifications','profile','settings'],prayer:['home','bible','growth','prayer','community','churches','ai','notifications','profile','settings'],secretary:['home','bible','growth','prayer','choir','community','churches','management','ai','notifications','profile','settings'],auditor:['home','bible','growth','prayer','community','churches','finance','ai','notifications','profile','settings']};return (map[session.role]||map.member).includes(view)}
function go(view){if(!session){currentView='welcome';render();return}if(view==='management'&&!['pastor','secretary','developer'].includes(session.role)){notify('Fuula kanaaf mirgi Pastor ykn Secretary barbaachisa.');return}if(view==='finance'&&!['pastor','finance','auditor','developer'].includes(session.role)){notify('Fuula faayinaansiif mirgi addaa barbaachisa.');return}if(view==='developer'&&session.role!=='developer'){notify('Fuula Developer seenuuf mirgi Developer barbaachisa.');return}currentView=view;closeSidebar();render();window.scrollTo({top:0,behavior:'smooth'})}

uired></div><button class="btn btn-primary btn-block" type="submit">🔐 ${t('login')} →</button><button class="btn btn-soft btn-block" style="margin-top:9px" type="button" id="reset-password">Jecha darbii irra deebi’ii qopheessi</button><button class="btn btn-ghost btn-block" style="margin-top:9px" type="button" data-action="register-church">＋ ${t('register')}</button></form><div class="demo-disclaimer">Account dhugaa qofa fayyadami. Role fi hayyamni server irratti mirkanaa’a.</div></section></div><footer class="welcome-footer">© 2026 Waldaa Connect Global · Account-based access</footer></main>`}
function bindWelcome(){document.getElementById('welcome-language')?.addEventListener('change',e=>{state.preferences.language=e.target.value;persist();render()});document.getElementById('login-form')?.addEventListener('submit',async e=>{e.preventDefault();if(!firebaseReady){notify('Firebase hin walqabanne. Internetii fi Firebase SDK qindeessi.');return}const fd=new FormData(e.currentTarget);authBooting=true;authFlowMode='login';try{const cred=await auth.signInWithEmailAndPassword(String(fd.get('email')||'').trim(),String(fd.get('password')||''));await establishFirebaseSession(cred.user)}catch(err){authBooting=false;notify(firebaseError(err));console.error(err)}finally{authFlowMode=null;authBooting=false}});document.getElementById('reset-password')?.addEventListener('click',async()=>{if(!firebaseReady){notify('Firebase hin walqabanne.');return}const email=(document.getElementById('login-email')?.value||'').trim();if(!email){notify('Dura email kee galchi.');return}try{await auth.sendPasswordResetEmail(email);notify('Linkiin jecha darbii haaromsuu email keetti ergame.')}catch(err){notify(firebaseError(err))}})}
async function establishFirebaseSession(user){
 if(!user||authFlowMode==='church-registration')return;
 try{
  const token=await user.getIdTokenResult(true);let profile=null,role='member',churchId='';
  if(token.claims.developer===true){role='developer'}else{
   const snap=await db.collection('users').doc(user.uid).get();
   if(!snap.exists){
    let hasPendingApplication=false;
    try{const apps=await db.collection('churchApplications').where('applicantUid','==',user.uid).limit(1).get();hasPendingApplication=!apps.empty&&apps.docs.some(d=>d.data().status==='pending')}catch(appErr){console.warn('Could not inspect own application status',appErr)}
    session=null;authBooting=false;currentView='welcome';render();
    notify(hasPendingApplication?'Iyyanni waldaa kee Firestore keessa jira; email kee mirkaneessi, Developer eeyyama eegadhu. Hanga eeyyamamutti login hin dandeessu.':'Account Firebase jira, garuu profile users keessatti hin jiru. Yoo Developer taate custom claim qopheessuun barbaachisa; yoo Paasterii taate iyyanni waldaa kee jalqaba eeyyamamuu qaba.');
    await auth.signOut().catch(()=>{});return;
   }
   profile=snap.data();
   if(profile.status!=='active'){session=null;authBooting=false;currentView='welcome';render();notify('Account kee amma hojii irra hin oolle. Admin/Developer waliin ilaali.');await auth.signOut().catch(()=>{});return}
   role=profile.role||'member';churchId=profile.churchId||'';
   if(!['pastor','member','finance','choir','prayer','secretary','auditor'].includes(role)){session=null;authBooting=false;currentView='welcome';render();notify('Role account kee sirrii miti; deeggarsa gaafadhu.');await auth.signOut().catch(()=>{});return}
  }
  session={id:user.uid,name:user.displayName||(profile&&profile.displayName)||user.email,email:user.email||'',role,churchId,mode:'firebase'};
  let deviceCheckUnavailable=false;
  if(role!=='developer'){
   try{await functions.httpsCallable('registerCurrentDevice')({deviceId:getDeviceId(),deviceLabel:(navigator.userAgent||'web').slice(0,160)})}
   catch(deviceErr){console.error(deviceErr);const code=deviceErr&&deviceErr.code||'';if(code==='functions/not-found'||code==='functions/unavailable'){deviceCheckUnavailable=true;console.warn('Optional device binding is unavailable until Cloud Functions are deployed.')}else{session=null;authBooting=false;currentView='welcome';render();notify('Mirkaneessi meeshaa hin milkoofne. Account device biraatti hidhamuu ykn Cloud Function dogoggora qabaachuu danda’a.');await auth.signOut().catch(()=>{});return}}
  }
  activeChurchId=churchId||activeChurchId;
  if(churchId){const churchSnap=await db.collection('churches').doc(churchId).get();if(churchSnap.exists)firebaseChurch={id:churchId,churchId,...churchSnap.data()}}
  currentView=role==='developer'?'developer':'home';authBooting=false;render();notify(deviceCheckUnavailable?'Seente. Hubachiisa: device-binding Cloud Function hin argamne; hanga deploy ta’utti nageenya meeshaa dabalataa hin hojjetu.':'Firebase irratti sirriitti seente.');
 }catch(err){console.error(err);authBooting=false;session=null;currentView='welcome';render();notify('Login/Firebase dogoggora: '+firebaseError(err));}
}
function firebaseError(err){const code=err&&err.code||'';const friendly={'auth/invalid-credential':'Email ykn password sirrii miti.','auth/user-not-found':'Account kana hin arganne.','auth/wrong-password':'Password sirrii miti.','auth/too-many-requests':'Yaalii baay’een; yeroo muraasa booda irra deebi’i.','auth/network-request-failed':'Internetii ilaali.','permission-denied':'Firestore Security Rules hayyama hin kennine.','functions/unauthenticated':'Maaloo irra deebi’ii seeni.','functions/permission-denied':'Aangoon hojii kanaaf hin jiru.','auth/email-already-in-use':'Email kanaan account duraan jira. Login godhi ykn iyyata duraan ergame ilaali.','auth/invalid-email':'Email sirrii galchi.','auth/weak-password':'Password yoo xiqqaate qubee 6 qabaachuu qaba.','auth/operation-not-allowed':'Firebase Authentication keessatti Email/Password hin banamne.','auth/email-not-verified':'Email kee mirkaneessi.','functions/not-found':'Cloud Function hin deploy ta’in ykn maqaan isaa sirrii miti.','functions/unavailable':'Firebase Cloud Functions yeroo ammaa hin argamne.','firestore/permission-denied':'Firestore Rules barreessuu/read gochuu dhowwe. Rules fi email applicant mirkaneessi.'};return friendly[code]||((err&&err.message)||'Dogoggorri Firebase uumame.')}
function watchFirebaseApplications(){if(!firebaseReady||!session||session.role!=='developer'||session.mode!=='firebase')return;if(unsubscribeApplications)unsubscribeApplications();unsubscribeApplications=db.collection('churchApplications').where('status','==','pending').onSnapshot(snap=>{firebaseApplications=snap.docs.map(d=>({id:d.id,...d.data()}));if(currentView==='developer')render()},err=>{console.error(err);notify('Iyyata Firestore dubbisuu hin dandeenye: '+firebaseError(err))})}
function watchFirebaseMembers(){if(!firebaseReady||!session||session.mode!=='firebase'||!session.churchId)return;if(unsubscribeMembers)unsubscribeMembers();unsubscribeMembers=db.collection('churches').doc(session.churchId).collection('members').onSnapshot(snap=>{firebaseMembers=snap.docs.map(d=>({id:d.id,...d.data(),churchId:session.churchId}));if(currentView==='management')render()},err=>{console.error(err);notify('Miseensota Firestore dubbisuu hin dandeenye: '+firebaseError(err))})}

if(firebaseReady){auth.onAuthStateChanged(async user=>{if(authFlowMode==='church-registration')return;authBooting=false;if(user&&!session)await establishFirebaseSession(user);else if(!user&&session?.mode==='firebase'){session=null;currentView='welcome';render()}if(user&&session?.role==='developer')watchFirebaseApplications()})}

function newMemberModal(){if(session.mode==='firebase'&&session.role!=='pastor'){notify('Account Firebase keessatti miseensa haaraa galmeessuun Paasterii waldaa sanaaf hayyamame qofa.');return}if(!['pastor','secretary','developer'].includes(session.role)){notify('Miseensa galmeessuuf mirga barbaachisa.');return}if(activeChurch().status!=='approved'){notify('Waldaan kun mirkanaa’uu qaba.');return}showModal('Miseensa haaraa galmeessi',`<form data-form="member"><div class="field"><label>Maqaa guutuu *</label><input name="name" required maxlength="100"></div><div class="field"><label>Email</label><input name="email" type="email" maxlength="120" required></div><div class="field"><label>Bilbila (yeroo Firebase hidhamu barbaachisa)</label><input name="phone" type="tel" maxlength="24" placeholder="+251…"></div><div class="field"><label>Role hojii</label><select name="role">${Object.entries(roleLabels[state.preferences.language]||roleLabels.om).filter(([k])=>!['developer','pastor'].includes(k)).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select></div>${imageUploadField('photo','Suuraa miseensaa (filannoo)','Suuraa nama sanaa qofa, hayyama isaa waliin.') }<div class="inline-note" style="margin-bottom:14px">${session.mode==='firebase'?'Account fi galmee miseensaa Firebase Authentication/Firestore keessatti Cloud Function amanamaan uuma.':'Galmee miseensaa dhugaa Cloud Functions deploy ta’e irratti raawwatama.'}</div><button class="btn btn-primary btn-block" type="submit">Galmeessi</button></form>`)}

function openSearchResults(query){query=query.trim().toLowerCase();if(!query)return;const results=[];books.forEach((b,i)=>{if(b[0].toLowerCase().includes(query)||b[1].toLowerCase().includes(query))results.push({title:`📖 ${b[0]} / ${b[1]}`,desc:`Kitaaba Macaafa Qulqulluu · ${b[2]} boqonnaa`,action:`data-book="${i}"`})});state.churches.forEach(c=>{if(c.name.toLowerCase().includes(query)||c.city.toLowerCase().includes(query)||c.country.toLowerCase().includes(query))results.push({title:`⛪ ${c.name}`,desc:`${c.city}, ${c.country} · ${c.status}`,view:'churches'})});state.posts.forEach(p=>{if(p.title.toLowerCase().includes(query)||p.body.toLowerCase().includes(query))results.push({title:`◎ ${p.title}`,desc:p.body.slice(0,100),view:'community'})});showModal(`Bu'aa barbaacha: ${query}`,results.length?results.slice(0,16).map(r=>`<button class="quick-action" style="margin-bottom:8px" ${r.action||''} ${r.view?`data-view="${r.view}"`:''}><span class="qa-icon">⌕</span><span><strong>${esc(r.title)}</strong><small>${esc(r.desc)}</small></span><span class="arrow">→</span></button>`).join(''):`<div class="empty-state"><div class="big">⌕</div><strong>Bu'aan hin argamne</strong><p>Jechoota biraa yaali.</p></div>`)}
function downloadFile(name,content,type='text/plain'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

document.addEventListener('click',async e=>{
 const target=e.target.closest('button,[data-view],[data-action],[data-book],[data-chapter],[data-bible-filter],[data-bible-mode],[data-bible-size],[data-bible-prev],[data-bible-next],[data-highlight-verse],[data-open-bible-book],[data-remove-bible-bookmark],[data-prayer-filter],[data-community-filter],[data-reading],[data-pray-for],[data-song],[data-like],[data-comment],[data-share],[data-approve-church],[data-reject-church],[data-switch-church],[data-verify-donation],[data-edit-member],[data-remove-verse],[data-ai-prompt],[data-read-notification]');if(!target)return;

()=>notify('Caqasni clipboard irratti kuufame.')).catch(()=>notify(txt));else notify(txt);break}case'mark-reading':if(!state.readingDone.includes('day1'))state.readingDone.push('day1');persist();render();notify('Dubbisa guyyaa xumurame.');break;case'save-verse':notify('Caqasa kuusuuf barruu Macaafa Qulqulluu hayyamame walqabsiisuu qabna. Amma boqonnaa guutuu bookmark gochuu dandeessa.');break;case'reset-reading':state.readingDone=[];persist();render();notify('Progress karoora deebifame.');break;case'export-finance':notify('Export faayinaansii hanga backend dhugaa qindaa’utti cufameera.');break;case'payment-info':showModal('Kaffaltii dhugaa',`<p class="small" style="line-height:1.8">Kaffaltii dhugaa jalqabuuf account merchant hayyamame, backend secure, callback/webhook mirkanaa'e, fi transaction reconciliation barbaachisa. Appiin frontend qofti kaffaltii mirkaneessuu hin danda'u.</p>`);break;case'read-all':notify('Beeksisa server irraa fe’uu fi kuusuu qindaa’uu qaba.');break;case'export-data':notify('Data account export server-side qindaa’uu qaba.');break;case'reset-demo':case'confirm-reset':notify('Galmee fakkeenyaa hin jiru.');break;case'edit-profile':editProfileModal();break;case'post-options':notify('Filannoo maxxansaa dabalataa yeroo booda dabalama.');break;default:break}return}
 if(target.hasAttribute('data-book')){bibleBook=Number(target.dataset.book);bibleChapter=1;bibleFilter='all';state.lastBibleRead=bibleRef();persist();render();return}
 if(target.hasAttribute('data-chapter')){bibleChapter=Number(target.dataset.chapter);state.lastBibleRead=bibleRef();persist();render();return}

 if(target.hasAttribute('data-bible-prev')){if(bibleChapter>1)bibleChapter--;else if(bibleBook>0){bibleBook--;bibleChapter=books[bibleBook][2]}else{notify('Kitaaba kana dura hin jiru.');return}state.lastBibleRead=bibleRef();persist();render();return}
 if(target.hasAttribute('data-bible-next')){if(bibleChapter<books[bibleBook][2])bibleChapter++;else if(bibleBook<books.length-1){bibleBook++;bibleChapter=1}else{notify('Kitaabota 66 xumurte.');return}state.lastBibleRead=bibleRef();persist();render();return}
 if(target.hasAttribute('data-highlight-verse')){const key=target.dataset.highlightVerse;state.highlightedVerses=state.highlightedVerses||[];if(state.highlightedVerses.includes(key))state.highlightedVerses=state.highlightedVerses.filter(x=>x!==key);else state.highlightedVerses.push(key);persist();render();return}
 if(target.hasAttribute('data-open-bible-book')){bibleBook=Number(target.dataset.openBibleBook);bibleChapter=Number(target.dataset.openBibleChapter);bibleFilter='all';state.lastBibleRead=bibleRef();persist();render();return}
 if(target.hasAttribute('data-remove-bible-bookmark')){const [bi,ch]=target.dataset.removeBibleBookmark.split(':').map(Number);state.bibleBookmarks=(state.bibleBookmarks||[]).filter(x=>!(x.book===bi&&x.chapter===ch));persist();render();return}

 if(target.hasAttribute('data-like')){const p=state.posts.find(x=>String(x.id)===String(target.dataset.like));if(p){p.likes=(p.likes||0)+1;persist();render();notify('Galatoomi — jaalala kee dabaltetta.')}return}

 if(el.matches('[data-reading]')){const id=el.dataset.reading;if(el.checked&&!state.readingDone.includes(id))state.readingDone.push(id);else state.readingDone=state.readingDone.filter(x=>x!==id);persist();render();return}
 if(el.matches('#font-size')){state.preferences.fontSize=el.value;document.body.style.fontSize=el.value==='large'?'17px':'15px';persist();return}
 if(el.matches('#member-filter')){const q=el.value.toLowerCase();document.querySelectorAll('#members-table-body tr').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?'':'none');return}
});
document.addEventListener('submit',async e=>{
 const form=e.target;if(form.id==='bible-search-form'){e.preventDefault();window.bibleSearchQuery=(document.getElementById('bible-search-input')?.value||'').trim();bibleFilter='all';render();return}if(form.id==='ai-form'){e.preventDefault();const input=form.querySelector('#ai-input');const q=(input?.value||'').trim();if(q)sendAI(q);return}
 if(form.id==='church-register-form'||form.dataset.form==='church'){
  e.preventDefault();if(!firebaseReady){notify('Firebase hin walqabanne. Internetii fi Firebase SDK qindeessi.');return}
  const fd=new FormData(form);const name=String(fd.get('name')||'').trim(),email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||'');if(!name||!email||!password)return;
  let logoUrl='',registrationSucceeded=false;authFlowMode='church-registration';
  try{
   const logoFile=form.querySelector('input[name="logo"]')?.files?.[0];if(logoFile){notify('Logo xiqqeessaa fi Cloudinary irratti olkaa’aa jira…');logoUrl=await uploadImageToCloudinary(logoFile,'waldaa-connect/church-logos')}
   let applicantUser=auth.currentUser;
   if(applicantUser&&applicantUser.email&&applicantUser.email.toLowerCase()!==email.toLowerCase())throw new Error('Account biraan keessa seente jirta. Ba’iitii email waldaa galmeessuu barbaaddu fayyadami.');
   if(!applicantUser){try{applicantUser=(await auth.createUserWithEmailAndPassword(email,password)).user}catch(createErr){if(createErr.code==='auth/email-already-in-use'){applicantUser=(await auth.signInWithEmailAndPassword(email,password)).user}else{throw createErr}}}
   await applicantUser.updateProfile({displayName:String(fd.get('pastor')||'').trim()});if(!applicantUser.emailVerified)await applicantUser.sendEmailVerification();
   const prior=await db.collection('churchApplications').where('applicantUid','==',applicantUser.uid).limit(5).get();const existingPending=prior.docs.find(d=>d.data().status==='pending');
   if(existingPending){closeModal();notify('Iyyanni waldaa kee duraan ergameera. Email mirkaneessi; Developer eeyyama eegadhu.');registrationSucceeded=true;return}
   await db.collection('churchApplications').add({name,city:String(fd.get('city')||'').trim(),country:String(fd.get('country')||'').trim(),pastor:String(fd.get('pastor')||'').trim(),email:applicantUser.email||email,language:String(fd.get('language')||'om'),estimatedMembers:Number(fd.get('members')||0),...(logoUrl?{logoUrl}:{}),applicantUid:applicantUser.uid,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:1});
   closeModal();notify('Iyyanni waldaa Firestore keessatti kuufame. Email kee mirkaneessi; Developer eeyyama eegadhu. Hanga eeyyamamutti accountiin login hin seenu.');registrationSucceeded=true;return;
  }catch(err){console.error('Church registration failed',err);notify(firebaseError(err));return}
  finally{if(auth.currentUser)await auth.signOut().catch(()=>{});authFlowMode=null;authBooting=false;if(!registrationSucceeded)console.warn('Church application was not submitted; check the displayed Firebase error.');}
 }
 if(form.dataset.form==='prayer'){e.preventDefault();notify('Kuusaan kadhannaa online amma qindaa’aa jira. Data fakkeenyaa hin kuufne.');return}
 if(form.dataset.form==='song'){e.preventDefault();notify('Kuusaan faarfannaa online amma qindaa’aa jira. Data fakkeenyaa hin kuufne.');return}
 if(form.dataset.form==='post'){e.preventDefault();notify('Maxxansa hawaasaa online amma qindaa’aa jira. Data fakkeenyaa hin maxxanfamne.');return}
 if(form.dataset.form==='donation'){e.preventDefault();notify('Galmee maallaqaa dhugaa backend nageenya qabu barbaada. Data fakkeenyaa hin kuufne; kaffaltiin online Coming Soon dha.');return}
 if(form.dataset.form==='member'){e.preventDefault();if(!firebaseReady||session?.mode!=='firebase'){notify('Account Firebase dhugaa barbaachisa.');return}const fd=new FormData(form);let photoUrl='';try{const photoFile=form.querySelector('input[name="photo"]')?.files?.[0];if(photoFile){notify('Suuraa miseensaa xiqqeessaa fi olkaa’aa jira…');photoUrl=await uploadImageToCloudinary(photoFile,'waldaa-connect/member-photos')}}catch(uploadErr){notify(uploadErr.message||'Suuraa upload hin milkoofne.');return}const payload={name:String(fd.get('name')||'').trim(),email:String(fd.get('email')||'').trim(),phone:String(fd.get('phone')||'').trim(),role:String(fd.get('role')||'member'),...(photoUrl?{photoUrl}:{})};try{if(payload.role==='developer')throw new Error('Developer role miseensaaf kennamuu hin danda’u.');const result=await functions.httpsCallable('createChurchMember')({...payload});closeModal();showModal('Miseensi galmaa’e',`<p>Miseensi ${esc(payload.name)} Firestore keessatti galmaa’eera. Linkii qopheessuu:</p><div class="field"><label>Linkii account</label><textarea readonly>${esc(result.data.resetLink||'Email reset link qophaa’e')}</textarea></div><p class="small muted">Linkii kana karaa dhuunfaa fi nageenya qabuun miseensa sanaaf qoodi.</p>`);return}catch(err){console.error(err);notify(firebaseError(err));return}}
 if(form.dataset.form==='edit-member'){e.preventDefault();notify('Jijjiirama role server-side qofa raawwatamuu qaba.');return}
 if(form.dataset.form==='switch-role'){e.preventDefault();notify('Role ofumaan jijjiiruun cufameera. Hayyama server irratti mirkanaa’e qofa fayyadami.');return}
 if(form.dataset.form==='profile'){e.preventDefault();const fd=new FormData(form);const newName=String(fd.get('name')||session.name).trim();if(session.mode==='firebase'&&auth.currentUser){try{await auth.currentUser.updateProfile({displayName:newName});session.name=newName;closeModal();render();notify('Maqaan piroofaayilii sirreeffame.');}catch(err){notify(firebaseError(err))}}else notify('Account Firebase dhugaa barbaachisa.');return}
 if(form.dataset.form==='note'){e.preventDefault();const fd=new FormData(form);state.privateNotes.unshift({id:Date.now(),title:String(fd.get('title')),body:String(fd.get('body')),date:new Date().toLocaleDateString()});persist();closeModal();render();notify('Yaadannoon dhuunfaa browser kana keessatti kuufame.');return}
 if(form.dataset.form==='comment'){e.preventDefault();notify('Yaada maxxansuuf backend online barbaachisa.');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSidebar()}if(e.key==='Enter'&&e.target.id==='global-search'){e.preventDefault();openSearchResults(e.target.value)}});
// Initial visual settings and application boot.
if(state.preferences.fontSize==='large')document.body.style.fontSize='17px';
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline worker not available yet:', err))); }
</script>
