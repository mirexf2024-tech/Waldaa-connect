function translateDOM(scope=document){const lang=state.preferences.language||'om';if(lang==='om')return;const idx=lang==='am'?1:0;const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){const original=node.nodeValue;const key=original.trim();if(uiWords[key]){const lead=original.match(/^\s*/)?.[0]||'',trail=original.match(/\s*$/)?.[0]||'';node.nodeValue=lead+uiWords[key][idx]+trail;}}const attrMap={'Afaan filadhu':['Choose language','ቋንቋ ይምረጡ'],'Waldaa filadhu':['Choose church','ቤተ ክርስቲያን ይምረጡ'],'Maqaa barbaadi...':['Search by name...','በስም ፈልግ...'],'Fakkeenya: Adama':['Example: Adama','ምሳሌ፦ አዳማ'],'Fakkeenya: Mihratuun':['Example: Your name','ምሳሌ፦ ስምዎ']};scope.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a);if(v&&attrMap[v])el.setAttribute(a,attrMap[v][idx])}));}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function activeChurch(){if(session?.mode==='firebase'&&firebaseChurch&&firebaseChurch.id===activeChurchId)return firebaseChurch;return state.churches.find(c=>c.id===activeChurchId)||state.churches[0]}
function roleName(role){return (roleLabels[state.preferences.language]||roleLabels.om)[role]||role}
function notify(message){const el=document.getElementById('toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
function iconFor(view){const found=navGroups.flatMap(g=>g.items).find(i=>i[0]===view);return found?found[1]:'✦'}
function canSee(view){if(!session)return false;const map={developer:['developer','home','bible','growth','prayer','choir','community','churches','management','finance','ai','notifications','profile','settings'],pastor:['home','bible','growth','prayer','choir','community','churches','management','finance','ai','notifications','profile','settings'],member:['home','bible','growth','prayer','choir','community','churches','ai','notifications','profile','settings'],finance:['home','bible','growth','prayer','choir','community','churches','finance','ai','notifications','profile','settings'],choir:['home','bible','growth','prayer','choir','community','churches','ai','notifications','profile','settings'],prayer:['home','bible','growth','prayer','community','churches','ai','notifications','profile','settings'],secretary:['home','bible','growth','prayer','choir','community','churches','management','ai','notifications','profile','settings'],auditor:['home','bible','growth','prayer','community','churches','finance','ai','notifications','profile','settings']};return (map[session.role]||map.member).includes(view)}
function go(view){if(!session){currentView='welcome';render();return}if(view==='management'&&!['pastor','secretary','developer'].includes(session.role)){notify('Fuula kanaaf mirgi Pastor ykn Secretary barbaachisa.');return}if(view==='finance'&&!['pastor','finance','auditor','developer'].includes(session.role)){notify('Fuula faayinaansiif mirgi addaa barbaachisa.');return}if(view==='developer'&&session.role!=='developer'){notify('Fuula Developer seenuuf mirgi Developer barbaachisa.');return}currentView=view;closeSidebar();render();window.scrollTo({top:0,behavior:'smooth'})}
function enterDemo(role='member',name='Miseensa Demo',email='member@example.com'){session={id:'demo-'+Date.now(),name,email,role,churchId:activeChurchId,mode:'demo'};currentView=role==='developer'?'developer':'home';state.activities.unshift({icon:'👋',title:'Seensa demo',text:`${name} akka ${roleName(role)}tti seene.`,time:'Amma'});persist();render();notify('Demo keessatti seente. Odeeffannoon kun local device irratti qofa kuufama.')}
function signOut(){const wasFirebase=session?.mode==='firebase';session=null;currentView='welcome';if(unsubscribeApplications){unsubscribeApplications();unsubscribeApplications=null}if(unsubscribeMembers){unsubscribeMembers();unsubscribeMembers=null}render();if(wasFirebase&&auth)auth.signOut().catch(console.error);notify('Seensa keessaa baate.')}
function showModal(title,body,footer=''){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-header"><h3>${esc(title)}</h3><button class="close-btn" type="button" data-action="close-modal" aria-label="Cufi">✕</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-body" style="padding-top:0">${footer}</footer>`:''}</section></div>`;translateDOM(document.getElementById('modal-root'))}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function closeSidebar(){document.querySelector('.sidebar')?.classList.remove('open');document.querySelector('.sidebar-overlay')?.remove()}
function openSidebar(){const side=document.querySelector('.sidebar');if(!side)return;side.classList.add('open');if(!document.querySelector('.sidebar-overlay')){const over=document.createElement('div');over.className='sidebar-overlay';over.addEventListener('click',closeSidebar);document.body.appendChild(over)}}
function applyTheme(){document.body.classList.toggle('dark',!!state.preferences.dark);document.documentElement.lang=state.preferences.language||'om';const theme=document.querySelector('meta[name="theme-color"]');if(theme)theme.content=state.preferences.dark?'#0d1727':'#082b5c'}
function render(){applyTheme();const root=document.getElementById('root');if(!session){root.innerHTML=renderWelcome();bindWelcome();translateDOM(root);return}if(!canSee(currentView))currentView='home';root.innerHTML=renderShell();bindApp();translateDOM(root);if(currentView==='management'&&session.mode==='firebase')watchFirebaseMembers()}
function languageOptions(){return `<option value="om" ${state.preferences.language==='om'?'selected':''}>Afaan Oromoo</option><option value="am" ${state.preferences.language==='am'?'selected':''}>አማርኛ</option><option value="en" ${state.preferences.language==='en'?'selected':''}>English</option>`}
function renderWelcome(){return `<main class="welcome-page"><header class="welcome-top"><div class="brand"><div class="brand-mark">✝</div><div><div class="brand-name">WALDAA CONNECT</div><div class="brand-sub">GLOBAL CHURCH NETWORK</div></div></div><label class="small" style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.7)">${t('language')}<select id="welcome-language" aria-label="Afaan filadhu">${languageOptions()}</select></label></header><div class="welcome-content"><section class="hero-copy"><div class="hero-label">✦ &nbsp; FAITH • COMMUNITY • SERVICE</div><h1>Amantii keenya,<br><span>addunyaa waliin.</span></h1><p>Waldoota fi amantoota addunyaa mara irraa walitti fiduuf, guddina hafuuraa, hawaasa, fi hojii waldaa bakka tokkootti wal qunnamsiisuuf ijaaramaa jirra.</p><div class="hero-actions"><button class="btn btn-gold" data-action="jump-login">⛪ &nbsp; ${t('demo')}</button><button class="btn btn-ghost" style="color:white;border-color:rgba(255,255,255,.24)" data-action="register-church">＋ &nbsp; ${t('register')}</button></div><div class="hero-proof"><div class="proof-item"><span class="proof-dot">✓</span> Waldoota hedduu deeggaruuf</div><div class="proof-item"><span class="proof-dot">♡</span> Guddina hafuuraa</div><div class="proof-item"><span class="proof-dot">⌘</span> Mobile-first</div></div><div class="welcome-features"><div class="welcome-feature"><span>📖</span><strong>Macaafa Qulqulluu</strong><p>Dubbisa fi karoora hafuuraa</p></div><div class="welcome-feature"><span>🤝</span><strong>Hawaasa Addunyaa</strong><p>Waldoota walitti fiduu</p></div><div class="welcome-feature"><span>🛡️</span><strong>Nageenya</strong><p>Iccitii fi mirga kabajuu</p></div></div></section><section class="hero-panel" id="demo-login"><div class="demo-label">WALDAA CONNECT · PREVIEW</div><h2>${t('welcome')}</h2><p>Fuula demo keessaa seeniitii qabiyyee appii qoradhu.</p><form id="demo-form"><div class="field"><label for="demo-name">${t('fullName')}</label><input id="demo-name" name="name" placeholder="Fakkeenya: Mihratuun" value="Miseensa Demo" required maxlength="80"></div><div class="field"><label for="demo-email">${t('email')}</label><input id="demo-email" name="email" type="email" placeholder="hello@example.com" value="member@example.com" required></div><div class="field"><label for="demo-password">${t('password')}</label><input id="demo-password" name="password" type="password" minlength="6" autocomplete="current-password" placeholder="••••••••" required></div><div class="field"><label for="demo-role">Role demo qofaaf</label><select id="demo-role" name="role"><option value="member">👤 Member — Miseensa</option><option value="pastor">⛪ Pastor / Church Admin</option><option value="finance">💳 Finance Manager</option><option value="choir">🎵 Choir Leader</option><option value="prayer">🙏 Prayer Leader</option><option value="secretary">📝 Secretary</option><option value="auditor">🔍 Auditor</option><option value="developer">👑 Developer Console</option></select></div><div class="field"><label for="demo-church">Waldaa demo</label><select id="demo-church" name="church">${state.churches.filter(c=>c.status==='approved').map(c=>`<option value="${esc(c.id)}" ${c.id===activeChurchId?'selected':''}>${esc(c.name)} · ${esc(c.country)}</option>`).join('')}</select></div><button class="btn btn-primary btn-block" type="submit">🔐 ${t('login')} Firebase &nbsp; →</button><button class="btn btn-soft btn-block" style="margin-top:9px" type="button" data-action="demo-access">Preview demo (rolewwan test qofa)</button></form><div class="demo-disclaimer">ⓘ Firebase sign-in dhugaa. Demo preview keessatti role filachuun data dhugaa ykn mirga server hin kennu.</div></section></div><footer class="welcome-footer">© 2026 Waldaa Connect Global · Prototype / Demo · Built for faith and community</footer></main>`}
function bindWelcome(){document.getElementById('welcome-language')?.addEventListener('change',e=>{state.preferences.language=e.target.value;persist();render()});document.querySelector('[data-action="jump-login"]')?.addEventListener('click',()=>{document.getElementById('demo-login')?.scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('demo-email')?.focus()});document.getElementById('demo-form')?.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);if(!firebaseReady){notify('Firebase hin jalqabne. Internetii fi SDK ilaali.');return}const email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||'');try{const cred=await auth.signInWithEmailAndPassword(email,password);await establishFirebaseSession(cred.user)}catch(err){notify(firebaseError(err));console.error(err)}})}
async function establishFirebaseSession(user){try{const token=await user.getIdTokenResult(true);let profile=null,role='member',churchId='';if(token.claims.developer===true){role='developer'}else{const snap=await db.collection('users').doc(user.uid).get();if(!snap.exists){notify('Account kee argame; garuu profile/role isaa hin jiru. Iyyata waldaa galmeessite yoo ta’e email kee mirkaneessi, Developer eeyyama eegadhu.');return}profile=snap.data();if(profile.status!=='active'){notify('Account kee amma hojii irra hin oolle. Admin/Developer waliin ilaali.');await auth.signOut();return}role=profile.role||'member';churchId=profile.churchId||'';if(!['pastor','member','finance','choir','prayer','secretary','auditor'].includes(role)){notify('Role account kee sirrii miti; deeggarsa gaafadhu.');await auth.signOut();return}}session={id:user.uid,name:user.displayName||(profile&&profile.displayName)||user.email,email:user.email||'',role,churchId,mode:'firebase'};activeChurchId=churchId||activeChurchId;if(churchId){const churchSnap=await db.collection('churches').doc(churchId).get();if(churchSnap.exists)firebaseChurch={id:churchId,churchId,...churchSnap.data()}}currentView=role==='developer'?'developer':'home';authBooting=false;render();notify('Firebase irratti sirriitti seente.')}catch(err){console.error(err);notify('Profile account dubbisuu hin dandeenye: '+firebaseError(err))}}
function firebaseError(err){const code=err&&err.code||'';const friendly={'auth/invalid-credential':'Email ykn password sirrii miti.','auth/user-not-found':'Account kana hin arganne.','auth/wrong-password':'Password sirrii miti.','auth/too-many-requests':'Yaalii baay’een; yeroo muraasa booda irra deebi’i.','auth/network-request-failed':'Internetii ilaali.','permission-denied':'Firestore Security Rules hayyama hin kennine.','functions/unauthenticated':'Maaloo irra deebi’ii seeni.','functions/permission-denied':'Aangoon hojii kanaaf hin jiru.','auth/email-already-in-use':'Email kanaan account duraan jira.'};return friendly[code]||((err&&err.message)||'Dogoggorri Firebase uumame.')}
function watchFirebaseApplications(){if(!firebaseReady||!session||session.role!=='developer'||session.mode!=='firebase')return;if(unsubscribeApplications)unsubscribeApplications();unsubscribeApplications=db.collection('churchApplications').where('status','==','pending').onSnapshot(snap=>{firebaseApplications=snap.docs.map(d=>({id:d.id,...d.data()}));if(currentView==='developer')render()},err=>{console.error(err);notify('Iyyata Firestore dubbisuu hin dandeenye: '+firebaseError(err))})}
function watchFirebaseMembers(){if(!firebaseReady||!session||session.mode!=='firebase'||!session.churchId)return;if(unsubscribeMembers)unsubscribeMembers();unsubscribeMembers=db.collection('churches').doc(session.churchId).collection('members').onSnapshot(snap=>{firebaseMembers=snap.docs.map(d=>({id:d.id,...d.data(),churchId:session.churchId}));if(currentView==='management')render()},err=>{console.error(err);notify('Miseensota Firestore dubbisuu hin dandeenye: '+firebaseError(err))})}

if(firebaseReady){auth.onAuthStateChanged(async user=>{authBooting=false;if(user&&!session)await establishFirebaseSession(user);else if(!user&&session?.mode==='firebase'){session=null;currentView='welcome';render()}if(user&&session?.role==='developer')watchFirebaseApplications()})}

function currentPageTitle(){const viewKeys={home:'home',bible:'bible',growth:'growth',prayer:'prayer',choir:'choir',community:'community',finance:'finance',churches:'churches',management:'management',developer:'developer',ai:'ai',notifications:'notifications',profile:'profile',settings:'settings'};return t(viewKeys[currentView]||'home')}

/span><span class="stat-icon">🔔</span></div><div class="stat-number">${unread}</div><div class="small muted">Hin dubbifamne</div></div></div><div class="grid grid-2" style="margin-bottom:20px"><section><div class="section-head"><div><div class="eyebrow">GO-TO</div><h2>${t('quickActions')}</h2><p>Hojiiwwan yeroo baay’ee barbaachisan.</p></div></div><div class="grid grid-2"><button class="quick-action" data-view="bible"><span class="qa-icon">📖</span><span><strong>Macaafa Qulqulluu</strong><small>Dubbisa kee itti fufi</small></span><span class="arrow">→</span></button><button class="quick-action" data-view="growth"><span class="qa-icon" style="background:#fff0c9">🌱</span><span><strong>Guddina Hafuuraa</strong><small>Karoora guyyaa</small></span><span class="arrow">→</span></button><button class="quick-action" data-view="prayer"><span class="qa-icon" style="background:#f0eaff">🙏</span><span><strong>Kadhannaa</strong><small>Gaaffii ergi</small></span><span class="arrow">→</span></button><button class="quick-action" data-view="community"><span class="qa-icon" style="background:#e2f7ed">🤝</span><span><strong>Hawaasa</strong><small>Beeksisa fi sagantaa</small></span><span class="arrow">→</span></button></div></section><section><div class="section-head"><div><div class="eyebrow">SCRIPTURE</div><h2>${t('dailyVerse')}</h2><p>Yaadannoo guyyaa kanaaf.</p></div><button class="action-link" data-view="bible">Macaafa bani →</button></div><div class="verse-card"><div class="verse-top"><span class="pill" style="background:#fff0bd;color:#8d6813">CAQASA GUYYAA</span><button class="action-link" data-action="save-verse">♡ Kuusi</button></div><blockquote>“Yoo Waaqayyo anaa wajjin jiraate, ani homaa hin sodaadhu.”</blockquote><cite>Faarfannaa 23 · Yaadannoo demo</cite><div class="small muted" style="margin-top:13px">Hubachiisa: Barruun armaan olii caqasa fakkeenyaa demo ti; hiika Macaafa Qulqulluu guutuu waliin mirkaneessuu barbaada.</div></div></section></div><div class="grid grid-2"><section class="card card-pad"><div class="section-head"><div><div class="eyebrow">ACTIVITY</div><h2>${t('recentActivity')}</h2></div><button class="action-link" data-view="notifications">${t('viewAll')} →</button></div>${state.activities.slice(0,4).map(a=>`<div class="activity-item"><div class="avatar">${esc(a.icon||'✦')}</div><div style="flex:1;min-width:0"><strong>${esc(a.title)}</strong><p>${esc(a.text)}</p><time>${esc(a.time)}</time></div></div>`).join('')}</section><section class="card card-pad"><div class="section-head"><div><div class="eyebrow">CHURCH NETWORK</div><h2>Waldoota walitti hidhatan</h2></div><button class="action-link" data-view="churches">Ilaali →</button></div>${state.churches.filter(c=>c.status==='approved').slice(0,3).map(c=>`<div class="activity-item"><div class="avatar ${c.id==='wc-nairobi'?'green':''}">⛪</div><div style="flex:1;min-width:0"><strong>${esc(c.name)}</strong><p>📍 ${esc(c.city)}, ${esc(c.country)} · ${Number(c.members)||0} miseensa</p></div><span class="pill success">${t('approved')}</span></div>`).join('')}</section></div>`}
function renderBible(){const book=books[bibleBook]||books[18];return `<div class="section-head"><div><div class="eyebrow">SCRIPTURE LIBRARY</div><h2>${t('bible')}</h2><p>Kitaabota Macaafa Qulqulluu 66 — caasaa fi filannoo kitaabaa.</p></div><button class="btn btn-soft" data-action="save-verse">♡ Caqasa Kuusi</button></div><div class="inline-note" style="margin-bottom:17px">ℹ️ <strong>Hubachiisa demo:</strong> Kutaan kun amma maqaa kitaabota 66, lakkoofsa boqonnaa fi caqasoota fakkeenyaa muraasa qaba. Barruun hiika Macaafa Qulqulluu guutuu ammallee hin fe’amne. Barruu guutuu dabaluu dura hiika hayyama itti fayyadamaa qabu filachuun barbaachisa.</div><div class="view-tabs"><button class="view-tab ${bibleFilter==='all'?'active':''}" data-bible-filter="all">Kitaabota 66</button><button class="view-tab ${bibleFilter==='OT'?'active':''}" data-bible-filter="OT">Kakuu Moofaa · 39</button><button class="view-tab ${bibleFilter==='NT'?'active':''}" data-bible-filter="NT">Kakuu Haaraa · 27</button><button class="view-tab ${bibleFilter==='saved'?'active':''}" data-bible-filter="saved">♡ Caqasa koo</button></div>${bibleFilter==='saved'?renderSavedVerses():`<div class="grid" style="grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px"><section class="card card-pad"><div class="row-between" style="margin-bottom:14px"><h3 class="card-title">Kitaaba filadhu</h3><span class="pill">${bibleFilter==='NT'?'27':'39'}+ kitaaba</span></div><div class="book-grid">${books.map((b,i)=>({b,i})).filter(x=>bibleFilter==='all'||x.b[3]===bibleFilter).map(({b,i})=>`<button class="book-btn ${i===bibleBook?'active':''}" data-book="${i}"><strong>${esc(b[0])}</strong><small>${esc(b[1])} · ${b[2]} boq.</small></button>`).join('')}</div></section><section class="card card-pad"><div class="row-between"><div><div class="eyebrow">READING</div><h3 class="card-title">${esc(book[0])}</h3><p class="small muted">${esc(book[1])} · Boqonnaa filadhu</p></div><span class="avatar gold">📖</span></div><div clas guyyaa 7</h2><p>Guyyaa xumurte irratti mallattoo kaa’i.</p></div><button class="btn btn-soft" data-action="reset-reading">Reset demo</button></div>${plans.map((p,i)=>`<div class="settings-row"><div class="row" style="align-items:flex-start"><div class="avatar ${state.readingDone.includes(p.id)?'green':''}">${state.readingDone.includes(p.id)?'✓':String(i+1).padStart(2,'0')}</div><div><strong>${esc(p.title)}</strong><p>${esc(p.ref)} · ${p.time}</p></div></div><label class="switch" aria-label="Guyyaa xumurame"><input type="checkbox" data-reading="${p.id}" ${state.readingDone.includes(p.id)?'checked':''}><span class="slider"></span></label></div>`).join('')}</section><div class="grid grid-2" style="margin-top:18px"><button class="quick-action" data-action="add-note"><span class="qa-icon">✍️</span><span><strong>Yaadannoo dhuunfaa</strong><small>Barumsa har'aa kee kuusi</small></span><span class="arrow">→</span></button><button class="quick-action" data-view="ai"><span class="qa-icon">✧</span><span><strong>Gaaffii hafuuraa gaafadhu</strong><small>Gargaaraa demo fayyadami</small></span><span class="arrow">→</span></button></div>`}

ass="row-between"><span class="small muted">Kutaa: ${esc(p.category)}</span><button class="action-link" data-pray-for="${p.id}">🙏 Kadhadheera</button></div></article>`).join(''):`<div class="card empty-state"><div class="big">🙏</div><strong>Gaaffiin filatame hin jiru</strong></div>`}<div class="inline-note" style="margin-top:16px">🔐 Iccitii: Demo keessatti odeeffannoon browser kana irratti kuufama. Yeroo sirna dhugaa ijaarru, gaaffii dhuunfaa abbaa isaa fi nama mirga qabu qofaaf mul’isuun Firebase Security Rules keessatti mirkanaa’a.</div>`}
function renderChoir(){return `<div class="section-head"><div><div class="eyebrow">WORSHIP & MUSIC</div><h2>${t('choir')}</h2><p>Faarfannaa, shaakala fi qindaa’ina gareewwanii.</p></div><button class="btn btn-primary" data-action="new-song">＋ Gaaffii Faarfannaa</button></div><div class="grid grid-3" style="margin-bottom:18px"><div class="card stat-card"><div class="stat-top"><span class="stat-label">Faarfannaa</span><span class="stat-icon">♫</span></div><div class="stat-number">${state.songs.filter(s=>s.status==='approved').length}</div><div class="small muted">Demo library</div></div><div class="card stat-card"><div class="stat-top"><span class="stat-label">Gareewwan</span><span class="stat-icon">👥</span></div><div class="stat-number">3</div><div class="small muted">Waliigalaa · Dargaggoota · Ijoollee</div></div><div class="card stat-card"><div class="stat-top"><span class="stat-label">Shaakala itti aanu</span><span class="stat-icon">🗓️</span></div><div class="stat-number" style="font-size:22px">Sanbata</div><div class="small muted">Sa’aatii 9:00 · demo</div></div></div><div class="inline-note" style="margin-bottom:16px">Gaaffiin faarfannaa haaraan demo keessatti “Pending” ta’a. Sirna dhugaa keessatti akka waliigalteen keenyaatti Developer mirkaneessuu qaba; yeroo ammaa backend hin jiru.</div><div class="grid grid-2">${state.songs.map(song=>`<article class="song-card"><div class="song-cover">♫</div><div style="min-width:0;flex:1"><div class="row-between" style="align-items:flex-start;gap:5px"><h3>${esc(song.title)}</h3><span class="pill ${song.status==='approved'?'success':'pending'}">${song.status==='approved'?'Approved':'Pending'}</span></div><p>Garee: ${esc(song.group)} · ${esc(song.leader)}</p><div class="small muted" style="line-height:1.65">${esc(song.lyrics||'Jecha faarfannaa hin dabalamin.')}</div><button class="action-link" style="padding-left:0;margin-top:6px" data-song="${song.id}">Jecha guutuu ilaali →</button></div></article>`).join('')}</div><div clas function renderCommunity(){return `<div class="section-head"><div><div class="eyebrow">CHURCH COMMUNITY</div><h2>${t('community')}</h2><p>Beeksisa, wal-jajjabeessuu fi hojii hawaasaa.</p></div><button class="btn btn-primary" data-action="new-post">＋ Barreeffama Haaraa</button></div><div class="grid grid-2" style="margin-bottom:17px"><div class="card card-pad"><div class="row"><span class="avatar green">🤝</span><div><h3 class="card-title">Hawaasa waldaa</h3><p class="small muted">Beeksisa fi sagantaa waldaa hordofi.</p></div></div></div><div class="card card-pad"><div class="row"><span class="avatar gold">🌍</span><div><h3 class="card-title">Global Church Network</h3><p class="small muted">Waldoota mirkanaa’an ilaali.</p><button class="action-link" data-view="churches" style="padding-left:0">Waldoota ilaali →</button></div></div></div></div><div class="tag-row" style="margin-bottom:16px"><button class="tag-btn ${communityFilter==='all'?'active':''}" data-community-filter="all">Hundaa</button><button class="tag-btn ${communityFilter==='announcement'?'active':''}" data-community-filter="announcement">Beeksisa</button><button class="tag-btn ${communityFilter==='service'?'active':''}" data-community-filter="service">Tajaajila hawaasaa</button></div>${state.posts.map(p=>`<article class="card post-card"><div class="row"><div class="avatar ${p.id%2?'blue':'green'}">${p.id%2?'⛪':'🤝'}</div><div style="flex:1"><h3>${esc(p.title)}</h3><div class="small muted">${esc(p.by)} · ${esc(p.date)}</div></div><button class="icon-btn" style="min-width:34px;height:34px" data-action="post-options" data-id="${p.id}">•••</button></div><p>${esc(p.body)}</p><div class="post-actions"><button data-like="${p.id}">♡ Jaaladhe (${p.likes||0})</button><button data-comment="${p.id}">💬 Yaada</button><button data-share="${p.id}">↗ Qoodi</button></div></article>`).join('')}<div class="inline-note">Hawaasa demo kana keessatti barruun, jaallannaa fi yaadni browser kee irratti kuufama. Maxxansa addunyaa irrat function renderFinance(){const rows=state.donations.filter(d=>d.churchId===activeChurchId);const total=rows.filter(d=>d.status==='Mirkanaa’e').reduce((s,d)=>s+Number(d.amount||0),0);return `<div class="section-head"><div><div class="eyebrow">TRANSPARENT STEWARDSHIP</div><h2>${t('finance')}</h2><p>Galmee demo, kurnoo, kennaa fi gabaasa waldaa.</p></div>${['pastor','finance','developer'].includes(session.role)?'<button class="btn btn-primary" data-action="new-donation">＋ Galmee Haaraa</button>':''}</div><div class="inline-note" style="margin-bottom:17px">🛡️ <strong>Faayinaansii demo qofa:</strong> kun kaffaltii dhugaa hin fudhatu; Telebirr ykn baankii waliin wal hin qabatu. Transaction ID qofa kaffaltii mirkaneessuuf gahaa miti. Role fi kuusaan dhugaa Firebase/backend irratti ijaarama.</div><div class="grid grid-3" style="margin-bottom:18px"><div class="card stat-card"><div class="stat-top"><span class="stat-label">Galii mirkanaa’e · demo</span><span class="stat-icon">💰</span></div><div class="stat-number">${total.toLocaleString()} <span style="font-size:12px">ETB</span></div><div class="small muted">Galmeewwan local qofa</div></div><div class="card stat-card"><div class="stat-top"><span class="stat-label">Galmee</span><span class="stat-icon">🧾</span></div><div class="stat-number">${rows.length}</div><div class="small muted">Kaffaltii / kennaa</div></div><div class="card stat-card"><div class="stat-top"><span class="stat-label">Eegaa jiru</span><span class="stat-icon">⏳</span></div><div class="stat-number">${rows.filter(d=>d.status!=='Mirkanaa’e').length}</div><div class="small muted">Mirkaneessa barbaada</div></div></div><section class="card"><div class="card-pad row-between"><div><h3 class="card-title">Seenaa galii</h3><p class="small muted">${esc(activeChurch().name)}</p></div><button class="btn btn-soft" data-action="export-finance">⇩ CSV Buusi</button></div><div class="table-wrap"><table><thead><tr><th>Guyyaa</th><th>Maqaa</th><th>Gosa</th><th>Maallaqa</th><th>Haala</th>${['pastor','finance','developer'].includes(session.role)?'<th>Hojii</th>':''}</tr></thead><tbody>${rows.length?rows.map(d=>`<tr><td>${esc(d.date)}</td><td>${esc(d.name)}</td><td>${esc(d.type)}</td><td><strong>${Number(d.amount).toLocaleString()} ETB</strong></td><td><span class="pill ${d.status==='Mirkanaa’e'?'success':'pending'}">${esc(d.status)}</span></td>${['pastor','finance','developer'].includes(session.role)?`<td><button class="action-link" data-verify-donation="${d.id}">Mirkaneessi</button></td>`:''}</tr>`).join(''):`<tr><td colspan="6" class="muted">Galmeen hin jiru.</td></tr>`}</tbody></table></div></section><div class="grid grid-2" style="margin-top:18px"><section class="card card-pad"><h3 class="card-title">Qajeelfama iftoominaa</h3><p class="small muted" style="line-height:1.8">Galii fi baasii qoodanii galmeessuu, seenaa jijjiiramaa kuusuu, fi Auditor akka galmee hayyamame qofa ilaalu gochuun amantaa hawaasaa ijaara.</p></section><section class="card card-pad"><h3 class="card-title">Kaffaltii online</h3><p class="small muted" style="line-height:1.8">Telebirr, baankii fi tajaajiloota biroo itti hidhuun gara fuulduraatti qophaa’a. Yeroo ammaa button kaffaltii dhugaa hin jiru.</p><button class="btn btn-soft" data-action="payment-info">Odeeffannoo dabalataa</button></section></div>`}

function renderManagement(){const members=session.mode==='firebase'?firebaseMembers:state.members.filter(m=>m.churchId===activeChurchId);return `<div class="section-head"><div><div class="eyebrow">CHURCH OPERATIONS</div><h2>${t('management')}</h2><p>Miseensota fi aangoo waldaa ammaa.</p></div><button class="btn btn-primary" data-action="new-member">＋ Miseensa Galmeessi</button></div><div class="role-note" style="margin-bottom:18px">👑 ${session.mode==='firebase'?'Ati account mirkanaa’e dha:':'Ati demo keessatti'} <strong>${esc(roleName(session.role))}</strong> dha. Sirna dhugaa keessatti mirgi hojii backend irratti mirkanaa’a.</div><div class="grid grid-3" style="margin-bottom:18px"><div class="card stat-card"><div class="stat-top"><span class="stat-label">Miseensota</span><span class="stat-icon">👥</span></div><div class="stat-number">${members.length}</div></div><div class="card stat-card"><div class="stat-top"><span class="stat-label">Hoggantoota</span><span class="stat-icon">👑</span></div><div class="stat-number">${members.filter(m=>m.role!=='member').length}</div></div><div class="card stat-card"><div class="stat-top"><span class="stat-label">Waldaa</span><span class="stat-icon">⛪</span></div><div class="stat-number" style="font-size:18px">${esc(activeChurch().name)}</div></div></div><section class="card"><div class="card-pad row-between"><div><h3 class="card-title">Galmee miseensotaa</h3><p class="small muted">${session.mode==='firebase'?'Live records — Firestore':'Demo records — local browser'}</p></div><input id="member-filter" placeholder="Maqaa barbaadi..." style="max-width:190px;border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--surface);color:var(--ink)"></div><div class="table-wrap"><table><thead><tr><th>Maqaa</th><th>Email</th><th>Role</th><th>Haala</th><th>Hojii</th></tr></thead><tbody id="members-table-body">${members.map(m=>`<tr><td><strong>${esc(m.name)}</strong></td><td>${esc(m.email||'—')}</td><td>${esc(roleName(m.role))} function editProfileModal(){showModal('Piroofaayilii Sirreessi',`<form data-form="profile"><div class="field"><label>Maqaa guutuu</label><input name="name" required value="${esc(session.name)}" maxlength="80"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(session.email||'')}" maxlength="120"></div><button class="btn btn-primary btn-block" type="submit">Kuusi</button></form>`)}
function noteModal(){showModal('Yaadannoo hafuuraa dhuunfaa',`<form data-form="note"><div class="field"><label>Mata duree</label><input name="title" required maxlength="100" placeholder="Barumsa har'aa"></div><div class="field"><label>Yaadannoo</label><textarea name="body" required maxlength="5000" placeholder="Caqasa, barumsa ykn kadhannaa dhuunfaa..."></textarea></div><button class="btn btn-primary btn-block" type="submit">Yaadannoo Kuusi</button></form>${state.privateNotes.length?`<div class="divider"></div><h4>Yaadannoowwan kee duraanii</h4>${state.privateNotes.slice(-5).reverse().map(n=>`<div class="activity-item"><div><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><time>${esc(n.date)}</time></div></div>`).join('')}`:''}`)}
function answerFaithQuestion(q){const s=q.toLowerCase();if(/kadh|prayer|ጸሎት/.test(s))return `Kadhannaan akka hariiroo namaa fi Waaqayyoo keessatti ta'u hubachuun ni gargaara. Yeroo tasgabbaa'aa filadhu, waan garaa kee keessa jiru dhugumaan dubbadhu, galata fi namoota biroofis kadhadhu. Qorannoo dabalataaf Maatewos 6:5–13 ilaali.\n\nKun deebii demo dha; hiika ykn gorsa paasterii bakka hin bu'u.`;if(/jaalala|love|ፍቅር/.test(s))return `Mata dureen jaalalaa Macaafa Qulqulluu keessatti hojii, obsa, dhiifama fi nama biraaf yaaduun ibsama. Qorannoo dabalataaf 1 Qorontos 13 fi Yohaannis 13 ilaali; hiika waldaa keessanii waliin dubbisi.\n\nDeebiin kun demo dha.`;if(/abdi|hope|ተስፋ/.test(s))return `Abdiin yeroo rakkoo keessatti nama jajjabeessuu danda'a. Karoora dubbisaa keessatti Roomaa 15:13 fi Faarfannaa 27 qoradhu; nama amanamaa ykn paasterii kee waliin mari'adhu.\n\nDeebiin kun demo dha.`;if(/dhiif|forgiv|ይቅር/.test(s))return `Dhiifamni walitti araaramuu fi garaa laafina waliin wal qabata. Maatewos 18 fi Efesoon 4:32 qorachuu dandeessa. Haala miidhaa ykn nageenya irratti hundaa'een gorsa nama amanamaa irraa argachuun barbaachisaa dha.\n\nDeebiin kun demo dha.`;if(/macaa|bible|ቅዱስ/.test(s))return `Mata duree tokko filattee kitaabota walqabatan dubbisuu dandeessa. Fakkeenyaaf, jaalalaaf 1 Qorontos 13; kadhannaaf Maatewos 6; abdii fi jajjabinaaf Roomaa 15. Caqasa yeroo dubbistu hiika hayyamame fi qindoomina isaa waliin ilaali.\n\nHubachiisa: barruun guutuun demo keessatti hin dabalamin.`;return `Gaaffii kee galatoomi. Ani amma AI dhugaa miti; jechoota murtaa'an irratti hundaa'ee deebii demo qofa nan kenna. Gaaffii kee akka “kadhannaa”, “jaalala”, “abdii”, “dhiifama” ykn caqasa Macaafa Qulqulluu tokkootti sirreessitee gaafachuu dandeessa. Gaaffii murteessaa ta'e Paasterii ykn barsiisaa Macaafa Qulqulluu waliin mari'adhu.`}
function sendAI(q){const box=document.getElementById('ai-chat');if(!box)return;const user=document.createElement('div');user.className='chat-bubble user';user.textContent=q;box.appendChild(user);const ans=document.createElement('div');ans.className='chat-bubble assistant';ans.textContent=answerFaithQuestion(q);box.appendChild(ans);box.scrollTop=box.scrollHeight;const inp=document.getElementById('ai-input');if(inp)inp.value=''}
function openSearchResults(query){query=query.trim().toLowerCase();if(!query)return;const results=[];books.forEach((b,i)=>{if(b[0].toLowerCase().includes(query)||b[1].toLowerCase().includes(query))results.push({title:`📖 ${b[0]} / ${b[1]}`,desc:`Kitaaba Macaafa Qulqulluu · ${b[2]} boqonnaa`,action:`data-book="${i}"`})});state.churches.forEach(c=>{if(c.name.toLowerCase().includes(query)||c.city.toLowerCase().includes(query)||c.country.toLowerCase().includes(query))results.push({title:`⛪ ${c.name}`,desc:`${c.city}, ${c.country} · ${c.status}`,view:'churches'})});state.posts.forEach(p=>{if(p.title.toLowerCase().includes(query)||p.body.toLowerCase().includes(query))results.push({title:`◎ ${p.title}`,desc:p.body.slice(0,100),view:'community'})});showModal(`Bu'aa barbaacha: ${query}`,results.length?results.slice(0,16).map(r=>`<button class="quick-action" style="margin-bottom:8px" ${r.action||''} ${r.view?`data-view="${r.view}"`:''}><span class="qa-icon">⌕</span><span><strong>${esc(r.title)}</strong><small>${esc(r.desc)}</small></span><span class="arrow">→</span></button>`).join(''):`<div class="empty-state"><div class="big">⌕</div><strong>Bu'aan hin argamne</strong><p>Jechoota biraa yaali.</p></div>`)}
function downloadFile(name,content,type='text/plain'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function bindApp(){/* Events are delegated once below so rerendering never duplicates listeners. */}
// Delegated events keep this single-file prototype responsive after every render.
document.addEventListener('click',async e=>{
 const target=e.target.closest('button,[data-view],[data-action],[data-book],[data-chapter],[data-bible-filter],[data-prayer-filter],[data-community-filter],[data-reading],[data-pray-for],[data-song],[data-like],[data-comment],[data-share],[data-approve-church],[data-reject-church],[data-switch-church],[data-verify-donation],[data-edit-member],[data-remove-verse],[data-ai-prompt],[data-read-notification]');if(!target)return;
 if(target.dataset.view){e.preventDefault();go(target.dataset.view);return}
 if(target.dataset.action){e.preventDefault();const a=target.dataset.action;switch(a){case'demo-access':{const f=document.getElementById('demo-form');if(!f)return;const fd=new FormData(f);activeChurchId=String(fd.get('church')||'wc-adama');enterDemo(String(fd.get('role')||'member'),String(fd.get('name')||'Demo User'),String(fd.get('email')||''));break}case'open-menu':openSidebar();break;case'more-menu':openSidebar();notify('Menuu guutuu gara bitaa irratti argita.');break;case'signout':signOut();break;case'toggle-theme':state.preferences.dark=!state.preferences.dark;persist();render();break;case'close-modal':closeModal();break;case'register-church':openRegisterChurch();break;case'new-prayer':newPrayerModal();break;case'new-song':newSongModal();break;case'new-post':newPostModal();break;case'new-donation':newDonationModal();break;case'new-member':newMemberModal();break;case'switch-role':switchRoleModal();break;case'edit-profile':editProfileModal();break;case'add-note':case'save-note':noteModal();break;case'mark-reading':if(!state.readingDone.includes('day1'))state.readingDone.push('day1');persist();render();notify('Dubbisa guyyaa demo xumurame.');break;case'save-verse':{const book=books[bibleBook]||books[18];const ref=`${book[0]} ${bibleChapter}:1`;if(!state.savedVerses.some(v=>v.ref===ref)){state.savedVerses.push({id:Date.now(),ref,text:'Barruu caqasa fakkeenyaa demo — barruu Macaafa Qulqulluu dhugaa miti.',date:new Date().toLocaleDateString()});persist();notify('Caqasni fakkeenyaa kuufame.')}else notify('Caqasni kun duraan kuufameera.');if(currentView==='bible')render();break}case'reset-reading':state.readingDone=[];persist();render();notify('Karoora demo deebifame.');break;case'export-finance':{const rows=state.donations.filter(d=>d.churchId===activeChurchId);const csv=[['Date','Name','Type','Amount_ETB','Status'],...rows.map(d=>[d.date,d.name,d.type,d.amount,d.status])].map(row=>row.map(csvCell).join(',')).join('\n');downloadFile('waldaa-connect-finance-demo.csv','\ufeff'+csv,'text/csv;charset=utf-8');notify('CSV demo buufame.');break}case'payment-info':showModal('Kaffaltii dhugaa',`<p class="small" style="line-height:1.8">Kaffaltii dhugaa jalqabuuf account merchant hayyamame, backend secure, callback/webhook mirkanaa'e, fi transaction reconciliation barbaachisa. Appiin frontend qofti kaffaltii mirkaneessuu hin danda'u.</p>`);break;case'read-all':state.notifications.forEach(n=>n.read=true);persist();render();notify('Beeksisni hundi dubbifame.');break;case'export-data':downloadFile('waldaa-connect-demo-data.json',JSON.stringify(state,null,2),'application/json');notify('Odeeffannoo demo buufame.');break;case'reset-demo':showModal('Demo data deebisi',`<p>Odeeffannoo browser kana keessa jiru gara data jalqabaa demo tti deebisuu barbaaddaa?</p><button class="btn btn-danger btn-block" data-action="confirm-reset">Eeyyee, deebisi</button>`);break;case'confirm-reset':state=structuredClone(seedState);persist();closeModal();render();notify('Demo data deebifame.');break;case'edit-profile':editProfileModal();break;case'post-options':notify('Filannoo maxxansaa dabalataa yeroo booda dabalama.');break;default:break}return}
 if(target.hasAttribute('data-book')){bibleBook=Number(target.dataset.book);bibleChapter=1;bibleFilter='all';render();return}
 if(target.hasAttribute('data-chapter')){bibleChapter=Number(target.dataset.chapter);render();return}
 if(target.hasAttribute('data-bible-filter')){bibleFilter=target.dataset.bibleFilter;render();return}
 if(target.hasAttribute('data-prayer-filter')){prayerFilter=target.dataset.prayerFilter;render();return}
 if(target.hasAttribute('data-community-filter')){communityFilter=target.dataset.communityFilter;render();return}
 if(target.hasAttribute('data-pray-for')){const p=state.prayers.find(x=>String(x.id)===String(target.dataset.prayFor));if(p)notify('Waaqayyo gaaffii kana keessatti jajjabina haa kennu. 🙏');return}
 if(target.hasAttribute('data-song')){const s=state.songs.find(x=>String(x.id)===String(target.dataset.song));if(s)showModal(s.title,`<span class="pill ${s.status==='approved'?'success':'pending'}">${esc(s.status)}</span><p class="small muted">Garee: ${esc(s.group)} · ${esc(s.leader)}</p><p style="line-height:1.8;white-space:pre-wrap">${esc(s.lyrics||'Jecha faarfannaa hin dabalamin.')}</p>`);return}
 if(target.hasAttribute('data-like')){const p=state.posts.find(x=>String(x.id)===String(target.dataset.like));if(p){p.likes=(p.likes||0)+1;persist();render();notify('Galatoomi — jaalala kee dabaltetta.')}return}
 if(target.hasAttribute('data-comment')){const p=state.posts.find(x=>String(x.id)===String(target.dataset.comment));if(p)showModal('Yaada: '+p.title,`<p class="small muted">Comment dhaabbataa backend hin qabu; demo qofa.</p><form data-form="comment"><input type="hidden" name="id" value="${p.id}"><div class="field"><label>Yaada kee</label><textarea name="body" required maxlength="600"></textarea></div><button class="btn btn-primary btn-block" type="submit">Yaada galmeessi</button></form>`);return}
 if(target.hasAttribute('data-share')){const p=state.posts.find(x=>String(x.id)===String(target.dataset.share));const shareText=p?`${p.title}\n${p.body}`:'';if(navigator.share){navigator.share({title:p?.title||'Waldaa Connect',text:shareText}).catch(()=>{})}else if(navigator.clipboard?.writeText){navigator.clipboard.writeText(shareText).then(()=>notify('Barreeffamni clipboard irratti kuufame.')).catch(()=>notify('Qooduun browser kana keessatti hin deeggaramne.'))}else notify('Qooduun browser kana keessatti hin deeggaramne.');return}
 if(target.hasAttribute('data-approve-church')){const id=target.dataset.approveChurch;if(session?.mode==='firebase'&&session.role==='developer'&&id.startsWith('fbapp:')){try{const result=await functions.httpsCallable('approveChurchApplication')({applicationId:id.slice(6)});notify('Waldaan eeyyamame; Firestore keessatti churchId '+result.data.churchId+' uumame.');return}catch(err){console.error(err);notify(firebaseError(err));return}}const c=state.churches.find(c=>c.id===id);if(c&&session.role==='developer'&&session.mode==='demo'){c.status='approved';c.churchId=c.churchId||('wc-'+Date.now().toString(36));c.provisioningStatus='demo-ready';c.approvedAt=new Date().toISOString();state.activities.unshift({icon:'✅',title:'Waldaa mirkanaa’e',text:`${c.name} demo keessatti mirkanaa’e.`,time:'Amma'});persist();render();notify('Waldaan demo keessatti mirkanaa’e; churchId demo uumame.')}return}
 if(target.hasAttribute('data-reject-church')){const id=target.dataset.rejectChurch;if(session?.mode==='firebase'&&session.role==='developer'&&id.startsWith('fbapp:')){try{await functions.httpsCallable('rejectChurchApplication')({applicationId:id.slice(6),reason:'Does not meet registration requirements'});notify('Iyyanni waldaa didame; sababni isaa kuufame.')}catch(err){console.error(err);notify(firebaseError(err))}return}const c=state.churches.find(c=>c.id===id);if(c&&session.role==='developer'&&session.mode==='demo'){state.churches=state.churches.filter(x=>x.id!==c.id);persist();render();notify('Gaaffiin demo irraa haqame.')}return}
 if(target.hasAttribute('data-switch-church')){const c=state.churches.find(c=>c.id===target.dataset.switchChurch);if(c&&c.status==='approved'){activeChurchId=c.id;if(session)session.churchId=c.id;persist();render();notify('Waldaa filatame: '+c.name)}return}
 if(target.hasAttribute('data-verify-donation')){if(!['pastor','finance','developer'].includes(session.role)){notify('Mirkaneessuuf mirgi hin jiru.');return}const d=state.donations.find(d=>String(d.id)===String(target.dataset.verifyDonation));if(d){if(d.status==='Mirkanaa’e'){notify('Galmeen kun duraan mirkanaa’eera (demo).')}else{d.status='Mirkanaa’e';persist();render();notify('Galmee demo mirkaneessite. Kaffaltii dhugaa miti.')}}return}
 if(target.hasAttribute('data-edit-member')){editMemberModal(target.dataset.editMember);return}
 if(target.hasAttribute('data-remove-verse')){state.savedVerses=state.savedVerses.filter(v=>String(v.id)!==String(target.dataset.removeVerse));persist();render();return}
 if(target.hasAttribute('data-ai-prompt')){if(currentView!=='ai')go('ai');setTimeout(()=>sendAI(target.dataset.aiPrompt),20);return}
 if(target.hasAttribute('data-read-notification')){const n=state.notifications[Number(target.dataset.readNotification)];if(n)n.read=true;persist();render();return}
});
document.addEventListener('change',e=>{
 const el=e.target;if(el.matches('#church-switch')){activeChurchId=el.value;if(session)session.churchId=activeChurchId;persist();render();return}
 if(el.matches('[data-pref]')){state.preferences[el.dataset.pref]=el.type==='checkbox'?el.checked:el.value;persist();render();return}
 if(el.matches('[data-pref-select]')){state.preferences[el.dataset.prefSelect]=el.value;persist();render();notify('Afaan jijjiirame.');return}
 if(el.matches('[data-reading]')){const id=el.dataset.reading;if(el.checked&&!state.readingDone.includes(id))state.readingDone.push(id);else state.readingDone=state.readingDone.filter(x=>x!==id);persist();render();return}
 if(el.matches('#font-size')){state.preferences.fontSize=el.value;document.body.style.fontSize=el.value==='large'?'17px':'15px';persist();return}
 if(el.matches('#member-filter')){const q=el.value.toLowerCase();document.querySelectorAll('#members-table-body tr').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?'':'none');return}
});
document.addEventListener('submit',async e=>{
 const form=e.target;if(form.id==='ai-form'){e.preventDefault();const input=form.querySelector('#ai-input');const q=(input?.value||'').trim();if(q)sendAI(q);return}
 if(form.id==='church-register-form'||form.dataset.form==='church'){e.preventDefault();const fd=new FormData(form);const name=String(fd.get('name')||'').trim(),email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||'');if(!name)return;if(firebaseReady){try{const currentUser=auth.currentUser;let applicantUser;if(currentUser&&currentUser.email&&currentUser.email.toLowerCase()===email.toLowerCase()){applicantUser=currentUser}else if(currentUser){throw new Error('Account biraan keessa seente jirta. Ba’iitii iyyata waldaa haaraa galchi.')}else{applicantUser=(await auth.createUserWithEmailAndPassword(email,password)).user}await applicantUser.updateProfile({displayName:String(fd.get('pastor')||'').trim()});if(!applicantUser.emailVerified)await applicantUser.sendEmailVerification();await db.collection('churchApplications').add({name,city:String(fd.get('city')||'').trim(),country:String(fd.get('country')||'').trim(),pastor:String(fd.get('pastor')||'').trim(),email,language:String(fd.get('language')||'om'),estimatedMembers:Number(fd.get('members')||0),applicantUid:applicantUser.uid,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:1});closeModal();notify('Iyyanni Firestore keessatti kuufame. Email kee mirkaneessi; Developer eeyyama eegadhu.');return}catch(err){console.error(err);notify(firebaseError(err));return}}const c={id:'church-'+Date.now(),churchId:null,name,city:String(fd.get('city')||'').trim(),country:String(fd.get('country')||'').trim(),pastor:String(fd.get('pastor')||'').trim(),email,language:String(fd.get('language')||'om'),members:Number(fd.get('members')||0),status:'pending',provisioningStatus:'waiting-for-developer-approval',createdAt:new Date().toISOString()};state.churches.push(c);state.activities.unshift({icon:'📨',title:'Gaaffii waldaa haaraa',text:`${c.name} gaaffii demo erge. Mirkaneessa Developer eegaa jira.`,time:'Amma'});persist();closeModal();if(session){currentView=session.role==='developer'?'developer':'churches';render()}notify('Gaaffiin demo galmaa’e; Pending dha.');return}
 if(form.dataset.form==='prayer'){e.preventDefault();const fd=new FormData(form);state.prayers.unshift({id:Date.now(),title:String(fd.get('title')),body:String(fd.get('body')),category:String(fd.get('category')),visibility:String(fd.get('visibility')),status:'Kadhannaa itti fufa',by:session.name,ownerId:session.id,date:'Har’a'});state.activities.unshift({icon:'🙏',title:'Gaaffii kadhannaa haaraa',text:String(fd.get('title')),time:'Amma'});persist();closeModal();render();notify('Gaaffiin kadhannaa demo kuufame.');return}
 if(form.dataset.form==='song'){e.preventDefault();const fd=new FormData(form);state.songs.unshift({id:Date.now(),title:String(fd.get('title')),group:String(fd.get('group')),leader:String(fd.get('leader')||session.name),status:'pending',lyrics:String(fd.get('lyrics')||'')});persist();closeModal();render();notify('Gaaffii faarfannaa demo ergame; Pending dha.');return}
 if(form.dataset.form==='post'){e.preventDefault();const fd=new FormData(form);state.posts.unshift({id:Date.now(),title:String(fd.get('title')),body:String(fd.get('body')),by:session.name,date:'Amma',likes:0,category:String(fd.get('category'))});persist();closeModal();render();notify('Barreeffamni demo maxxanfame.');return}
 if(form.dataset.form==='donation'){e.preventDefault();const fd=new FormData(form);state.donations.unshift({id:Date.now(),name:String(fd.get('name')||'Maqaa hin kennamne'),type:String(fd.get('type')),amount:Number(fd.get('amount')),date:String(fd.get('date')),status:String(fd.get('status')),churchId:activeChurchId});persist();closeModal();render();notify('Galmeen demo kuufame; kaffaltii hin fudhanne.');return}
 if(form.dataset.form==='member'){e.preventDefault();const fd=new FormData(form);const payload={name:String(fd.get('name')||'').trim(),email:String(fd.get('email')||'').trim(),phone:String(fd.get('phone')||'').trim(),role:String(fd.get('role')||'member')};if(session?.mode==='firebase'){try{if(payload.role==='developer')throw new Error('Developer role miseensaaf kennamuu hin danda’u.');const result=await functions.httpsCallable('createChurchMember')({...payload});closeModal();showModal('Miseensi galmaa’e',`<p>Miseensi ${esc(payload.name)} Firestore keessatti galmaa’eera. Linkii account qopheessuuf:</p><div class="field"><label>Password reset / sign-in link</label><textarea readonly>${esc(result.data.resetLink||'Email invitation configured by backend')}</textarea></div><p class="small muted">Linkii kana karaa dhuunfaa fi nageenya qabuun miseensa sanaaf qoodi. Linkiin yeroo murtaa’e keessatti dhumata.</p>`);return}catch(err){console.error(err);notify(firebaseError(err));return}}state.members.push({id:Date.now(),...payload,churchId:activeChurch().churchId||activeChurchId,status:'demo-active',createdAt:new Date().toISOString()});persist();closeModal();render();notify('Miseensi demo waldaa ammaa jalatti kuufame. Account Firebase hin uumamne.');return}
 if(form.dataset.form==='edit-member'){e.preventDefault();const fd=new FormData(form);const member=state.members.find(m=>String(m.id)===String(fd.get('id')));if(member){member.role=String(fd.get('role'));persist();closeModal();render();notify('Role demo jijjiirame.')}return}
 if(form.dataset.form==='switch-role'){e.preventDefault();const fd=new FormData(form);const role=String(fd.get('role'));session.role=role;currentView=role==='developer'?'developer':'home';persist();closeModal();render();notify('Role demo jijjiirame. Nageenya dhugaa miti.');return}
 if(form.dataset.form==='profile'){e.preventDefault();const fd=new FormData(form);session.name=String(fd.get('name')||session.name);session.email=String(fd.get('email')||'');persist();closeModal();render();notify('Piroofaayiliin demo sirreeffame.');return}
 if(form.dataset.form==='note'){e.preventDefault();const fd=new FormData(form);state.privateNotes.unshift({id:Date.now(),title:String(fd.get('title')),body:String(fd.get('body')),date:new Date().toLocaleDateString()});persist();closeModal();render();notify('Yaadannoon dhuunfaa browser kana keessatti kuufame.');return}
 if(form.dataset.form==='comment'){e.preventDefault();closeModal();notify('Yaadni demo galmaa’e; comment server irratti hin ergame.');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSidebar()}if(e.key==='Enter'&&e.target.id==='global-search'){e.preventDefault();openSearchResults(e.target.value)}});
// Initial visual settings and application boot.
if(state.preferences.fontSize==='large')document.body.style.fontSize='17px';
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline worker not available yet:', err))); }
</script>
