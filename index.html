                    { id: 'bible', icon: 'fa-book-bible', label: 'Wangeela' },
                    { id: 'pay', icon: 'fa-wallet', label: 'Kaffaltii' },
                    { id: 'choir', icon: 'fa-music', label: 'Choir' },
                    { id: 'profile', icon: 'fa-user', label: 'Profile' }
                ];
            } else if (role === 'choir') {
                tabs = [
                    { id: 'home', icon: 'fa-house', label: 'Home' },
                    { id: 'choirAdd', icon: 'fa-user-plus', label: 'Choir Ida\'i' },
                    { id: 'choirMembers', icon: 'fa-users', label: 'Tarree' },
                    { id: 'choirPosts', icon: 'fa-bullhorn', label: 'Faarfannaa' },
                    { id: 'profile', icon: 'fa-user', label: 'Profile' }

            } else if (role === 'finance') {
                tabs = [
                    { id: 'home', icon: 'fa-chart-pie', label: 'Home' },
                    { id: 'pay', icon: 'fa-cash-register', label: 'Kaffaltii' },
                    { id: 'verify', icon: 'fa-square-check', label: 'Mirkaneessi' },
                    { id: 'profile', icon: 'fa-user', label: 'Profile' }
                ];
            } else if (role === 'admin') {
                tabs = [
                    { id: 'home', icon: 'fa-chart-line', label: 'Home' },
                    { id: 'pay', icon: 'fa-wallet', label: 'Kaffaltii' },
                    { id: 'addMember', icon: 'fa-user-plus', label: 'Miseensa' },
                    { id: 'members', icon: 'fa-users', label: 'Tarree' },
                    { id: 'profile', icon: 'fa-user', label: 'Profile' }
                ];

                tabs = [
                    { id: 'home', icon: 'fa-code', label: 'Dev Panel' },
                    { id: 'bible', icon: 'fa-book', label: 'Bible Files' },
                    { id: 'profile', icon: 'fa-user', label: 'Profile' }
                ];

            return tabs.map(tab => {
                const isActive = appState.activeTab === tab.id;
                return `
                    <button onclick="appState.activeTab = '${tab.id}'; render();" class="flex flex-col items-center justify-center py-2 px-3 rounded-xl transition-all ${isActive ? 'text-indigo-400 bg-indigo-500/10 font-bold scale-105' : 'text-slate-400 hover:text-white font-medium'}">

                `;

        function renderTabContent() {
            const tab = appState.activeTab;
            const role = appState.role;

            if (tab === 'home') {
                if (role === 'member') return renderMemberHome();
                if (role === 'choir') return renderMemberHome();
                if (role === 'finance' || role === 'admin') return renderFinanceAdminHome();
                if (role === 'developer') return renderDeveloperHome();
            } else if (tab === 'bible') {
                return renderBibleViewer();
            } else if (tab === 'pay') {
                return renderPaymentScreen();
            } else if (tab === 'choir' || tab === 'choirPosts') {
                return renderChoirSongsScreen();
            } else if (tab === 'profile') {
                return renderProfileScreen();
            } else if (tab === 'addMember') {
                return renderAddMemberScreen();
            } else if (tab === 'members' || tab === 'choirMembers') {
                return renderMembersDirectoryScreen();
            } else if (tab === 'verify') {
                return renderVerifyPaymentsScreen();
            } else if (tab === 'choirAdd') {
                return renderAddChoirMemberScreen();
            }

            return `<div class="p-6 text-center text-slate-400">Content for ${tab} under ${role} role</div>`;
        }

        function submitPayment() {
            const amount = document.getElementById('payAmount').value;
            const transId = document.getElementById('payTransId').value;
            const bank = document.getElementById('payBank').value;
            const category = document.getElementById('payCategory').value;

            if (!amount || !transId) {
                showToast('Please fill all payment fields', false);
                return;
            }

            appState.db.finances.unshift({
                id: appState.db.finances.length + 1,
                name: appState.user.name,
                type: category,
                amount: parseFloat(amount),
                bank: bank,
                transId: transId,
                date: 'Just now',
                status: 'Pending'
            });

            showToast('Payment submitted successfully for verification!');
            sendTelegramNotification(`🚨 *Kaffaltiin Haaraa Gale!*\nMaqaa: ${appState.user.name}\nGosa: ${category}\nMaallaqa: ${amount} ETB\nTransID: ${transId}`);
            appState.activeTab = 'profile';
            render();
        }
